# 续写：作品创建自动派生作品技能（DEFAULT_TEMPLATE_SKILL_IDS）之一，L2 技能（tools/maxSteps）。
# tools 声明的工具必须存在于 toolRegistry（见 l2-skill-binding 测试），新增工具需同步注册。
$schema: https://raw.githubusercontent.com/liqms/wrisp-releases/main/resources/schemas/skill.schema.json
id: continue
name:
  zh: 续写
  en: Continue Writing
description:
  zh: 根据已有文本的内容和风格，自然流畅地续写后续内容，保持逻辑和文风的一致性
  en: Naturally continue the text based on its content and style, keeping logic and voice consistent
icon: ➡️
version: 1.1.0
author: Wrisp Team
category: [generation, continue]
tags:
  - zh: 续写
    en: continue
  - zh: 扩展
    en: extend
  - zh: 生成
    en: generate
  - zh: 写作
    en: write
enabled: true
# 「先检索再落笔」依赖 search_materials/knowledge_search 工具，L2 执行器按 tools 绑定
promptTemplate:
  zh: |-
    请先用 search_materials（作品素材检索，若在作品上下文）或 knowledge_search（知识库检索）找到与续写相关的素材，再基于素材自然续写：

    {{text}}

    要求：
    1. 先检索相关素材再落笔
    2. 自然流畅地延续原文的内容和风格
    3. 保持逻辑连贯性
    4. 只输出续写的内容，不要重复原文
  en: |-
    First use search_materials (project material search, when in a project context) or knowledge_search (knowledge base search) to find materials relevant to the continuation, then continue naturally based on them:

    {{text}}

    Requirements:
    1. Search for relevant materials before writing
    2. Continue naturally and fluently, matching the original content and style
    3. Maintain logical coherence
    4. Output only the continuation, do not repeat the original text
systemPrompt:
  zh: 你是一个专业的文本续写助手，擅长根据已有内容自然流畅地延续写作。
  en: You are a professional writing assistant skilled at naturally continuing existing text.
input:
  type: object
  properties:
    text:
      type: string
      description:
        zh: 需要续写的文本
        en: The text to continue
  required: [text]
output:
  type: text
maxSteps: 5
tools:
  - type: function
    function:
      name: search_materials
      description: 按作品检索创作素材（语义块/概念/主题），续写前先检索相关素材
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 检索关键词
          kinds:
            type: array
            items:
              type: string
              enum: [chunk, concept, topic]
          limit:
            type: integer
            description: 返回条数上限
        required: [query]
  - type: function
    function:
      name: knowledge_search
      description: 检索用户知识库（日志/概念/主题/页面/作品），返回带 ref 的片段
      parameters:
        type: object
        properties:
          query:
            type: string
            description: 检索词
          tier:
            type: string
            enum: [fast, keyword, semantic, hybrid, agent]
          limit:
            type: integer
            description: 返回条数上限
        required: [query]
preProcess:
  - type: trim
example:
  zh:
    input:
      text: 每天坚持阅读三十分钟，看似微不足道，但日积月累的力量不容小觑。
    output: 一年下来，你将读完数十本书，知识储备和思维深度都会有质的飞跃。更重要的是，这种习惯会潜移默化地改变你的思考方式，让你在面对问题时更加从容和理性。从今天开始，不妨为自己设定一个小目标，在固定的时间里，放下手机，拿起一本书，享受阅读带来的宁静与成长。
  en:
    input:
      text: Reading for thirty minutes every day may seem insignificant, but the power of accumulation over time should not be underestimated.
    output: 'Over the course of a year, you will finish dozens of books, and both your knowledge and depth of thinking will reach a new level. More importantly, this habit will subtly change the way you think, making you calmer and more rational when facing problems. Starting today, why not set a small goal for yourself: at a fixed time, put down your phone, pick up a book, and enjoy the tranquility and growth that reading brings.'


