# 大纲生成：作品创建自动派生作品技能（DEFAULT_TEMPLATE_SKILL_IDS），缺了应用无法运行。
# 输出契约：层级编号大纲，供创建流程直接落稿。
$schema: https://raw.githubusercontent.com/liqms/wrisp-releases/main/resources/schemas/skill.schema.json
id: outline
name:
  zh: 大纲生成
  en: Outline Generation
description:
  zh: 根据主题或内容自动生成结构化的文章大纲，涵盖主要章节和关键要点
  en: Automatically generate a structured article outline based on a topic or content, covering main sections and key points
icon: 📑
version: 1.0.0
author: Wrisp Team
category: [generation, outline]
tags:
  - zh: 大纲
    en: outline
  - zh: 结构
    en: structure
  - zh: 组织
    en: organize
  - zh: 规划
    en: plan
enabled: true
# 层级编号（1 / 1.1 / 1.1.1）是创建流程可解析的关键输出格式，勿改
promptTemplate:
  zh: |-
    请根据以下主题或内容生成一个结构化的文章大纲：

    {{text}}

    要求：
    1. 大纲应层次分明，包含主要章节和关键子要点
    2. 使用层级编号（如 1、1.1、1.1.1）
    3. 每个要点简洁明了
    4. 只输出大纲，不要添加额外解释
  en: |-
    Please generate a structured article outline based on the following topic or content:

    {{text}}

    Requirements:
    1. The outline should have a clear hierarchy, including main sections and key sub-points
    2. Use hierarchical numbering (e.g., 1, 1.1, 1.1.1)
    3. Keep each point concise and clear
    4. Output only the outline, without extra explanation
systemPrompt:
  zh: 你是一个专业的大纲生成助手，擅长将主题或内容组织成结构清晰、层次分明的文章大纲。
  en: You are a professional outline generation assistant skilled at organizing topics or content into clear, well-structured article outlines.
input:
  type: object
  properties:
    text:
      type: string
      description:
        zh: 需要生成大纲的主题或内容
        en: The topic or content to generate an outline for
  required: [text]
output:
  type: text
preProcess:
  - type: trim
example:
  zh:
    input:
      text: 远程办公的利与弊
    output: |-
      1. 引言
        1.1 远程办公的定义
        1.2 远程办公的兴起背景
      2. 远程办公的优势
        2.1 灵活的工作时间和地点
        2.2 减少通勤成本和时间
        2.3 提高工作自主性和效率
      3. 远程办公的挑战
        3.1 沟通协作的障碍
        3.2 工作与生活的界限模糊
        3.3 团队凝聚力的下降
      4. 成功实施远程办公的关键要素
        4.1 有效的工具和平台
        4.2 明确的工作流程和规范
        4.3 定期的沟通与反馈机制
      5. 结语
        5.1 远程办公的未来趋势
        5.2 对企业和个人的建议
  en:
    input:
      text: The pros and cons of remote work
    output: |-
      1. Introduction
        1.1 Definition of remote work
        1.2 Background of its rise
      2. Advantages of remote work
        2.1 Flexible working hours and location
        2.2 Reduced commuting costs and time
        2.3 Greater autonomy and efficiency
      3. Challenges of remote work
        3.1 Barriers to communication and collaboration
        3.2 Blurred boundaries between work and life
        3.3 Weakened team cohesion
      4. Key elements for successful remote work
        4.1 Effective tools and platforms
        4.2 Clear workflows and norms
        4.3 Regular communication and feedback
      5. Conclusion
        5.1 Future trends of remote work
        5.2 Advice for companies and individuals


