# 扩写：在保持原意基础上丰富细节/例证/论述。
$schema: https://raw.githubusercontent.com/liqms/wrisp-releases/main/resources/schemas/skill.schema.json
id: expand
name:
  zh: 扩写
  en: Expand
description:
  zh: 在保持原意的基础上扩展文本内容，增加细节、例证或论述，使内容更加丰富完整
  en: Expand the text while preserving its original meaning, adding details, examples, or arguments to make the content richer and more complete
icon: 📈
version: 1.0.0
author: Wrisp Team
category: [editing, rewrite]
tags:
  - zh: 扩写
    en: expand
  - zh: 细化
    en: elaborate
  - zh: 扩展
    en: extend
  - zh: 细节
    en: detail
enabled: true
# 输出契约：只输出扩写结果（executor 直接回显，不得夹带解释）；{{length}}/{{text}} 由执行器注入
promptTemplate:
  zh: |-
    请扩写以下文本，扩写长度为{{length}}：

    {{text}}

    要求：
    1. 保持原文的核心意思和逻辑结构
    2. 丰富细节、例证或论述
    3. 只输出扩写后的结果，不要添加任何解释
  en: |-
    Please expand the following text to a {{length}} length:

    {{text}}

    Requirements:
    1. Preserve the core meaning and logical structure of the original
    2. Enrich details, examples, or arguments
    3. Output only the expanded result, without any explanation
systemPrompt:
  zh: 你是一个专业的文本扩写助手，擅长在保持原意的基础上丰富内容和细节。
  en: You are a professional text expansion assistant skilled at enriching content and details while preserving the original meaning.
input:
  type: object
  properties:
    text:
      type: string
      description:
        zh: 需要扩写的文本
        en: The text to expand
    length:
      type: string
      enum: [short, medium, long]
      default: medium
      description:
        zh: 扩写长度
        en: Expansion length
  required: [text]
output:
  type: text
preProcess:
  - type: trim
example:
  zh:
    input:
      text: 阅读有诸多益处，能够增长知识、开阔视野。
      length: medium
    output: 阅读是一项受益终身的习惯，具有多方面的益处。首先，阅读能够帮助我们不断增长知识，无论是专业知识还是生活常识，都可以通过书籍获取。其次，阅读能够开阔我们的视野，让我们足不出户便能了解世界各地的风土人情、历史文化。此外，阅读还有助于提升思维能力和语言表达能力，是一种极具价值的自我投资方式。
  en:
    input:
      text: 'Reading has many benefits: it grows knowledge and broadens horizons.'
      length: medium
    output: Reading is a lifelong habit with benefits in many ways. First, reading helps us continuously grow our knowledge — whether professional expertise or everyday common sense, all can be gained through books. Second, reading broadens our horizons, letting us learn about the customs, cultures, and histories of places around the world without leaving home. In addition, reading also improves thinking and language skills, making it an extremely valuable form of self-investment.


